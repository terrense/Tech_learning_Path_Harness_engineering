<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Python Evaluation Harness Workflow</title>
  <desc id="desc">Workflow diagram for a Python evaluation harness, from scenario loading to adapter invocation, evaluator scoring, artifact storage, and policy decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="1280" height="820" fill="#f8fafc" />
  <text x="640" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">Python Evaluation Harness Workflow</text>
  <text x="640" y="92" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">A practical harness transforms scenario definitions into reproducible evidence and policy decisions.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="220" height="92" rx="14" fill="#0f766e" />
    <text x="180" y="196" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Scenario Loader</text>
    <text x="180" y="225" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ccfbf1">YAML · JSON · fixtures</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="380" y="160" width="220" height="92" rx="14" fill="#2563eb" />
    <text x="490" y="196" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Runner</text>
    <text x="490" y="225" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#dbeafe">timeout · retry · run id</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="160" width="220" height="92" rx="14" fill="#7c3aed" />
    <text x="800" y="196" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Adapter</text>
    <text x="800" y="225" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ede9fe">HTTP · CLI · model API</text>
  </g>
