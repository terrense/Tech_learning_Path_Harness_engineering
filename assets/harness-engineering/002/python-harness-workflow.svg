  </g>
  <g filter="url(#shadow)">
    <rect x="825" y="420" width="230" height="96" rx="14" fill="#16a34a" />
    <text x="940" y="458" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Policy Gate</text>
    <text x="940" y="488" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#dcfce7">pass · fail · review</text>
  </g>

