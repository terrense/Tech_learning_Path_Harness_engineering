    <text x="1110" y="196" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Target System</text>
    <text x="1110" y="225" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#e5e7eb">service · model · workflow</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="225" y="420" width="230" height="96" rx="14" fill="#ea580c" />
    <text x="340" y="458" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Evaluator</text>
    <text x="340" y="488" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ffedd5">assertions · metrics · score</text>
  </g>
