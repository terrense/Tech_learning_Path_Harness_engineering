<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Safety Case Evidence Graph</title><desc id="desc">A graph connecting the top release claim to evidence for quality, permission, observability, rollback, and privacy.</desc><rect width="1280" height="720" fill="#f7fee7"/><style>.claim{fill:#fff;stroke:#65a30d;stroke-width:3;rx:18}.sub{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.ev{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.risk{fill:#fff1f2;stroke:#e11d48;stroke-width:2;rx:12}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:800}.l{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.line{stroke:#475569;stroke-width:2.6;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#475569"/></marker></defs><text class="t h" x="70" y="70">Safety Case Evidence Graph</text><text class="t s" x="72" y="100">A release decision binds explicit claims to bounded scope, evidence, assumptions, residual risks and owners.</text><rect class="claim" x="390" y="135" width="500" height="90"/><text class="t l" x="430" y="172">Top Claim</text><text class="t s" x="430" y="202">Safe for canary 10 in human-approved mode</text><rect class="sub" x="95" y="310" width="215" height="78"/><text class="t l" x="120" y="342">Quality</text><rect class="sub" x="340" y="310" width="215" height="78"/><text class="t l" x="365" y="342">Permission</text><rect class="sub" x="585" y="310" width="215" height="78"/><text class="t l" x="610" y="342">Observability</text><rect class="sub" x="830" y="310" width="215" height="78"/><text class="t l" x="855" y="342">Rollback</text><rect class="risk" x="1075" y="310" width="150" height="78"/><text class="t l" x="1100" y="342">Privacy</text><rect class="ev" x="70" y="500" width="220" height="78"/><text class="t l" x="95" y="532">Eval Report</text><rect class="ev" x="315" y="500" width="220" height="78"/><text class="t l" x="340" y="532">Policy Sim</text><rect class="ev" x="560" y="500" width="220" height="78"/><text class="t l" x="585" y="532">Trace Audit</text><rect class="ev" x="805" y="500" width="220" height="78"/><text class="t l" x="830" y="532">Rollback Drill</text><rect class="ev" x="1050" y="500" width="220" height="78"/><text class="t l" x="1075" y="532">Leakage Scan</text><path class="line" d="M500 225 C380 260 265 286 210 305"/><path class="line" d="M590 225 C525 260 480 286 452 305"/><path class="line" d="M665 225 C678 260 688 286 692 305"/><path class="line" d="M755 225 C830 260 895 286 935 305"/><path class="line" d="M860 225 C1000 260 1108 286 1148 305"/><path class="line" d="M180 388 V495"/><path class="line" d="M425 388 V495"/><path class="line" d="M692 388 L672 495"/><path class="line" d="M938 388 L918 495"/><path class="line" d="M1150 388 V495"/></svg>
