<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Rollback Readiness Matrix</title><desc id="desc">A matrix of rollback objects, required identifiers, control actions, and verification signals.</desc><rect width="1280" height="720" fill="#fff7ed"/><style>.head{fill:#0f172a}.cell{fill:#fff;stroke:#fed7aa;stroke-width:2}.alt{fill:#fffbeb;stroke:#fed7aa;stroke-width:2}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{font-family:Arial,Helvetica,sans-serif;fill:#fff}.h{font-size:34px;font-weight:800}.th{font-size:19px;font-weight:700}.s{font-size:16px}.good{fill:#16a34a;rx:11}.bad{fill:#dc2626;rx:11}</style><text class="t h" x="70" y="70">Rollback Readiness Matrix</text><text class="t s" x="72" y="100">Every behavior-changing component needs an identifier, control action, and verification signal.</text><rect class="head" x="70" y="145" width="1140" height="54" rx="12"/><text class="w th" x="96" y="180">Rollback Object</text><text class="w th" x="335" y="180">Required Identifier</text><text class="w th" x="610" y="180">Control Action</text><text class="w th" x="910" y="180">Verification Signal</text><rect class="cell" x="70" y="205" width="250" height="70"/><text class="t th" x="96" y="246">Workflow graph</text><rect class="cell" x="320" y="205" width="270" height="70"/><text class="t s" x="345" y="246">workflow_version</text><rect class="cell" x="590" y="205" width="300" height="70"/><text class="t s" x="615" y="246">route traffic to previous DAG</text><rect class="cell" x="890" y="205" width="320" height="70"/><text class="t s" x="915" y="246">shadow replay diff passes</text><rect class="alt" x="70" y="275" width="250" height="70"/><text class="t th" x="96" y="316">Tool lease</text><rect class="alt" x="320" y="275" width="270" height="70"/><text class="t s" x="345" y="316">lease_family_id</text><rect class="alt" x="590" y="275" width="300" height="70"/><text class="t s" x="615" y="316">revoke write capability</text><rect class="alt" x="890" y="275" width="320" height="70"/><text class="t s" x="915" y="316">broker deny audit event</text><rect class="cell" x="70" y="345" width="250" height="70"/><text class="t th" x="96" y="386">Memory writes</text><rect class="cell" x="320" y="345" width="270" height="70"/><text class="t s" x="345" y="386">memory_policy_version</text><rect class="cell" x="590" y="345" width="300" height="70"/><text class="t s" x="615" y="386">freeze and quarantine writes</text><rect class="cell" x="890" y="345" width="320" height="70"/><text class="t s" x="915" y="386">provenance query returns zero drift</text><rect class="alt" x="70" y="415" width="250" height="70"/><text class="t th" x="96" y="456">External action</text><rect class="alt" x="320" y="415" width="270" height="70"/><text class="t s" x="345" y="456">idempotency_key</text><rect class="alt" x="590" y="415" width="300" height="70"/><text class="t s" x="615" y="456">run compensation job</text><rect class="alt" x="890" y="415" width="320" height="70"/><text class="t s" x="915" y="456">compensation report complete</text><rect class="cell" x="70" y="485" width="250" height="70"/><text class="t th" x="96" y="526">Prompt cache</text><rect class="cell" x="320" y="485" width="270" height="70"/><text class="t s" x="345" y="526">prompt_cache_key</text><rect class="cell" x="590" y="485" width="300" height="70"/><text class="t s" x="615" y="526">invalidate new cache entries</text><rect class="cell" x="890" y="485" width="320" height="70"/><text class="t s" x="915" y="526">cache miss telemetry confirms</text><rect class="good" x="350" y="610" width="250" height="42"/><text class="w th" x="378" y="637">ready: verified drills</text><rect class="bad" x="650" y="610" width="300" height="42"/><text class="w th" x="678" y="637">blocked: missing recovery proof</text></svg>
