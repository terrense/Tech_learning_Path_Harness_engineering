<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Agent Release Governance Control Plane</title><desc id="desc">Release governance control plane from proposal to evidence gates, safety case, rollout and rollback.</desc><rect width="1280" height="720" fill="#f8fafc"/><style>.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.gate{fill:#fefce8;stroke:#ca8a04;stroke-width:2;rx:16}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}.risk{fill:#fff1f2;stroke:#e11d48;stroke-width:2;rx:16}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:16px;fill:#475569}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#334155"/></marker></defs><text class="t h" x="70" y="70">Agent Release Governance Control Plane</text><rect class="box" x="70" y="150" width="220" height="120"/><text class="t l" x="105" y="195">Change Proposal</text><text class="t s" x="105" y="230">prompt / tool / memory</text><rect class="box" x="370" y="135" width="240" height="150"/><text class="t l" x="410" y="180">Release Bundle</text><text class="t s" x="410" y="214">signed artifacts</text><text class="t s" x="410" y="242">version matrix</text><text class="t s" x="410" y="270">rollout plan</text><rect class="gate" x="700" y="95" width="240" height="90"/><text class="t l" x="740" y="148">Policy Review</text><rect class="gate" x="700" y="225" width="240" height="90"/><text class="t l" x="760" y="278">Eval Gate</text><rect class="gate" x="700" y="355" width="240" height="90"/><text class="t l" x="755" y="408">Ops Gate</text><rect class="ok" x="1010" y="190" width="210" height="135"/><text class="t l" x="1050" y="245">Safety Case</text><text class="t s" x="1050" y="278">claims + evidence</text><rect class="box" x="395" y="470" width="230" height="120"/><text class="t l" x="430" y="520">Staged Rollout</text><rect class="risk" x="80" y="470" width="230" height="120"/><text class="t l" x="125" y="520">Rollback</text><path class="line" d="M290 210 H365"/><path class="line" d="M610 185 C650 160 660 140 695 140"/><path class="line" d="M610 210 H695"/><path class="line" d="M610 235 C650 330 660 390 695 400"/><path class="line" d="M940 140 C980 160 1000 210 1005 240"/><path class="line" d="M940 270 H1005"/><path class="line" d="M940 400 C980 380 1000 320 1005 295"/><path class="line" d="M1010 295 C850 430 700 520 630 530"/><path class="line" d="M395 530 H315"/><text class="t s" x="300" y="660">Invariant: rollout cannot exceed the evidence, permission, observability and rollback envelope approved for that stage.</text></svg>
