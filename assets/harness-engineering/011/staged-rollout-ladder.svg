<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Staged Agent Rollout Ladder</title><desc id="desc">A ladder chart showing agent rollout stages with increasing traffic and autonomy.</desc><rect width="1280" height="720" fill="#f8fafc"/><style>.axis{stroke:#334155;stroke-width:3}.step{stroke:#2563eb;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.risk{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:16px;fill:#475569}.p{font-size:28px;font-weight:800;fill:#1d4ed8}</style><text class="t h" x="70" y="70">Staged Agent Rollout Ladder</text><text class="t s" x="72" y="100">Traffic percentage and autonomy level advance independently; governance gates decide each promotion.</text><line class="axis" x1="120" y1="610" x2="1160" y2="610"/><line class="axis" x1="120" y1="610" x2="120" y2="145"/><path class="step" d="M165 560 H340 V470 H530 V375 H720 V280 H910 V190 H1100"/><rect class="card" x="140" y="520" width="220" height="105"/><text class="t l" x="165" y="553">Shadow</text><text class="p" x="165" y="589">0%</text><text class="t s" x="230" y="588">observe only</text><rect class="card" x="330" y="430" width="220" height="105"/><text class="t l" x="355" y="463">Canary 1</text><text class="p" x="355" y="499">1%</text><text class="t s" x="420" y="498">suggest only</text><rect class="card" x="520" y="335" width="230" height="105"/><text class="t l" x="545" y="368">Canary 10</text><text class="p" x="545" y="404">10%</text><text class="t s" x="625" y="403">human approved</text><rect class="card" x="710" y="240" width="240" height="105"/><text class="t l" x="735" y="273">Controlled 50</text><text class="p" x="735" y="309">50%</text><text class="t s" x="815" y="308">bounded action</text><rect class="card" x="900" y="150" width="245" height="105"/><text class="t l" x="925" y="183">GA</text><text class="p" x="925" y="219">100%</text><text class="t s" x="1018" y="218">policy bounded</text><rect class="risk" x="250" y="132" width="780" height="58"/><text class="t l" x="280" y="168">Automatic pause: unsafe tool attempt, tenant leakage, P0/P1 incident, trace loss, or rollback drill failure</text></svg>
