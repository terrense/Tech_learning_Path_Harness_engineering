<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Autonomy Maturity Model</title>
  <desc id="desc">Maturity model for AI agent autonomy from manual assistant to governed autonomous agent operations.</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.14" /></filter></defs>
  <rect width="1280" height="820" fill="#f8fafc" />
  <text x="640" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Agent Autonomy Maturity Model</text>
  <text x="640" y="92" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Autonomy should increase only when harness evidence, observability, and control mechanisms mature together.</text>
  <g transform="translate(100,145)" filter="url(#shadow)">
    <rect width="1080" height="560" rx="18" fill="#ffffff" stroke="#e5e7eb" />
    <line x1="0" y1="100" x2="1080" y2="100" stroke="#e5e7eb" stroke-width="2" />
    <line x1="0" y1="192" x2="1080" y2="192" stroke="#e5e7eb" />
    <line x1="0" y1="284" x2="1080" y2="284" stroke="#e5e7eb" />
    <line x1="0" y1="376" x2="1080" y2="376" stroke="#e5e7eb" />
    <line x1="0" y1="468" x2="1080" y2="468" stroke="#e5e7eb" />
    <line x1="170" y1="0" x2="170" y2="560" stroke="#e5e7eb" stroke-width="2" />
    <line x1="450" y1="0" x2="450" y2="560" stroke="#e5e7eb" stroke-width="2" />
    <line x1="730" y1="0" x2="730" y2="560" stroke="#e5e7eb" stroke-width="2" />
    <text x="85" y="60" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Level</text>
    <text x="310" y="60" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Agent Mode</text>
    <text x="590" y="60" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Harness Control</text>
    <text x="905" y="60" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Promotion Evidence</text>
    <text x="85" y="152" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">L1</text><text x="310" y="152" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">Chat assistant</text><text x="590" y="152" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">no side effects</text><text x="905" y="152" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">human judgment</text>
    <text x="85" y="244" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">L2</text><text x="310" y="244" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">Tool-assisted</text><text x="590" y="244" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">read-only tools</text><text x="905" y="244" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">tool success traces</text>
    <text x="85" y="336" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c3aed">L3</text><text x="310" y="336" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">Sandboxed actor</text><text x="590" y="336" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">write in sandbox</text><text x="905" y="336" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">eval pass + diff review</text>
    <text x="85" y="428" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ea580c">L4</text><text x="310" y="428" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">Bounded autonomous</text><text x="590" y="428" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">policy gates</text><text x="905" y="428" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">regression + incident data</text>
    <text x="85" y="520" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#be123c">L5</text><text x="310" y="520" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">Governed operations</text><text x="590" y="520" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">continuous monitoring</text><text x="905" y="520" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">auditable improvement loop</text>
  </g>
  <text x="640" y="780" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Generated for Terrence Shen · Autonomy is a privilege earned by evidence.</text>
</svg>
