<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Rollback And Incident Lifecycle</title>
  <desc id="desc">A lifecycle diagram for production AI agent incidents, from signal detection to rollback and postmortem learning.</desc>
  <defs>
    <style>
      .bg { fill: #f9fafb; }
      .stage { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 14; }
      .hot { fill: #fee2e2; stroke: #b91c1c; }
      .cool { fill: #e0f2fe; stroke: #0369a1; }
      .ok { fill: #dcfce7; stroke: #15803d; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 14px; }
      .arrow { stroke: #374151; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="text title" x="70" y="64">Rollback And Incident Lifecycle</text>
  <text class="text small" x="70" y="94">Agent incidents are handled as evidence-driven control decisions, not ad hoc prompt edits.</text>

  <rect class="stage cool" x="70" y="170" width="190" height="105"/>
  <text class="text label" x="113" y="210">Signal</text>
  <text class="text small" x="101" y="238">SLO breach</text>
  <text class="text small" x="101" y="258">user report</text>

  <rect class="stage hot" x="305" y="170" width="190" height="105"/>
  <text class="text label" x="350" y="210">Triage</text>
  <text class="text small" x="335" y="238">blast radius</text>
  <text class="text small" x="335" y="258">risk tier</text>

  <rect class="stage hot" x="540" y="170" width="190" height="105"/>
  <text class="text label" x="584" y="210">Contain</text>
  <text class="text small" x="570" y="238">throttle</text>
  <text class="text small" x="570" y="258">disable tool</text>

  <rect class="stage hot" x="775" y="170" width="190" height="105"/>
  <text class="text label" x="820" y="210">Rollback</text>
  <text class="text small" x="805" y="238">model/prompt</text>
  <text class="text small" x="805" y="258">policy/version</text>

  <rect class="stage ok" x="1010" y="170" width="145" height="105"/>
  <text class="text label" x="1042" y="210">Verify</text>
  <text class="text small" x="1034" y="238">shadow eval</text>
  <text class="text small" x="1034" y="258">SLO recover</text>

  <path class="arrow" d="M260 222 H303"/>
  <path class="arrow" d="M495 222 H538"/>
  <path class="arrow" d="M730 222 H773"/>
  <path class="arrow" d="M965 222 H1008"/>

  <rect class="stage" x="230" y="430" width="220" height="110"/>
  <text class="text label" x="284" y="470">Evidence Pack</text>
  <text class="text small" x="270" y="498">trace excerpts, artifacts</text>
  <text class="text small" x="270" y="518">timeline, owner, impact</text>

  <rect class="stage" x="520" y="430" width="220" height="110"/>
  <text class="text label" x="584" y="470">Postmortem</text>
  <text class="text small" x="560" y="498">root cause, policy gap</text>
  <text class="text small" x="560" y="518">missed detection</text>

  <rect class="stage" x="810" y="430" width="220" height="110"/>
  <text class="text label" x="862" y="470">Hardening</text>
  <text class="text small" x="850" y="498">new eval, runbook</text>
  <text class="text small" x="850" y="518">guardrail update</text>

  <path class="dash" d="M400 275 C390 340 360 380 340 428"/>
  <path class="arrow" d="M450 485 H518"/>
  <path class="arrow" d="M740 485 H808"/>
  <path class="dash" d="M920 430 C900 360 850 320 820 275"/>
</svg>