<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Regression Dashboard Topology</title>
  <desc id="desc">A topology for agent regression dashboards connecting datasets, runs, traces, scorecards, and release decisions.</desc>
  <defs>
    <style>
      .bg { fill: #f9fafb; }
      .node { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 16; }
      .data { fill: #e0f2fe; stroke: #0369a1; }
      .run { fill: #dcfce7; stroke: #15803d; }
      .metric { fill: #fef9c3; stroke: #a16207; }
      .risk { fill: #fee2e2; stroke: #b91c1c; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 14px; }
      .arrow { stroke: #374151; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="660"/>
  <text class="text title" x="60" y="58">Regression Dashboard Topology</text>
  <text class="text small" x="60" y="86">The dashboard is a release-control surface, not a passive chart collection.</text>
  <rect class="node data" x="80" y="150" width="210" height="115"/>
  <text class="text label" x="128" y="190">Dataset</text>
  <text class="text small" x="117" y="220">scenario split</text>
  <text class="text small" x="117" y="242">risk tier</text>
  <rect class="node run" x="375" y="150" width="210" height="115"/>
  <text class="text label" x="424" y="190">Eval Run</text>
  <text class="text small" x="410" y="220">candidate harness</text>
  <text class="text small" x="410" y="242">model/tool versions</text>
  <rect class="node metric" x="670" y="150" width="210" height="115"/>
  <text class="text label" x="718" y="190">Scorecard</text>
  <text class="text small" x="705" y="220">quality, safety</text>
  <text class="text small" x="705" y="242">latency, cost</text>
  <rect class="node risk" x="965" y="150" width="155" height="115"/>
  <text class="text label" x="1003" y="190">Gate</text>
  <text class="text small" x="997" y="220">promote</text>
  <text class="text small" x="997" y="242">rollback</text>
  <path class="arrow" d="M290 207 H373"/>
  <path class="arrow" d="M585 207 H668"/>
  <path class="arrow" d="M880 207 H963"/>
  <rect class="node" x="200" y="390" width="210" height="115"/>
  <text class="text label" x="247" y="430">Trace Drilldown</text>
  <text class="text small" x="236" y="460">tool calls</text>
  <text class="text small" x="236" y="482">policy decisions</text>
  <rect class="node" x="495" y="390" width="210" height="115"/>
  <text class="text label" x="542" y="430">Failure Clusters</text>
  <text class="text small" x="530" y="460">root cause</text>
  <text class="text small" x="530" y="482">owner routing</text>
  <rect class="node" x="790" y="390" width="210" height="115"/>
  <text class="text label" x="837" y="430">Release Notes</text>
  <text class="text small" x="827" y="460">evidence summary</text>
  <text class="text small" x="827" y="482">known risks</text>
  <path class="dash" d="M480 265 C480 330 305 330 305 388"/>
  <path class="arrow" d="M410 447 H493"/>
  <path class="arrow" d="M705 447 H788"/>
  <path class="dash" d="M895 390 C895 330 1042 330 1042 265"/>
</svg>
