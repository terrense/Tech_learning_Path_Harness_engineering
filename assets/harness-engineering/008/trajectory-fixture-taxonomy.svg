<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Trajectory Fixture Taxonomy</title>
  <desc id="desc">A taxonomy of fixtures used in agent trajectory evaluation.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .root { fill: #111827; rx: 18; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 16; }
      .blue { fill: #dbeafe; stroke: #1d4ed8; }
      .green { fill: #dcfce7; stroke: #15803d; }
      .amber { fill: #fef3c7; stroke: #b45309; }
      .rose { fill: #ffe4e6; stroke: #be123c; }
      .violet { fill: #ede9fe; stroke: #6d28d9; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .white { fill: #ffffff; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; }
      .line { stroke: #374151; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="text title" x="60" y="58">Trajectory Fixture Taxonomy</text>
  <rect class="root" x="435" y="98" width="330" height="92"/>
  <text class="text white label" x="492" y="137">Agent Eval Fixture</text>
  <text class="text white small" x="486" y="164">input + trace + stubs + oracle</text>
  <path class="line" d="M600 190 V245"/>
  <path class="line" d="M190 245 H1010"/>
  <path class="line" d="M190 245 V290"/>
  <path class="line" d="M395 245 V290"/>
  <path class="line" d="M600 245 V290"/>
  <path class="line" d="M805 245 V290"/>
  <path class="line" d="M1010 245 V290"/>
  <rect class="box blue" x="75" y="290" width="230" height="140"/>
  <text class="text label" x="119" y="328">Goal Fixture</text>
  <text class="text small" x="108" y="361">user objective</text>
  <text class="text small" x="108" y="386">constraints</text>
  <text class="text small" x="108" y="411">acceptance criteria</text>
  <rect class="box green" x="280" y="290" width="230" height="140"/>
  <text class="text label" x="328" y="328">State Fixture</text>
  <text class="text small" x="312" y="361">files, tickets, DB rows</text>
  <text class="text small" x="312" y="386">memory snapshot</text>
  <text class="text small" x="312" y="411">context budget</text>
  <rect class="box amber" x="485" y="290" width="230" height="140"/>
  <text class="text label" x="536" y="328">Tool Fixture</text>
  <text class="text small" x="522" y="361">deterministic stubs</text>
  <text class="text small" x="522" y="386">error injection</text>
  <text class="text small" x="522" y="411">side-effect ledger</text>
  <rect class="box rose" x="690" y="290" width="230" height="140"/>
  <text class="text label" x="742" y="328">Trace Oracle</text>
  <text class="text small" x="724" y="361">required milestones</text>
  <text class="text small" x="724" y="386">forbidden actions</text>
  <text class="text small" x="724" y="411">human review labels</text>
  <rect class="box violet" x="895" y="290" width="230" height="140"/>
  <text class="text label" x="947" y="328">Score Spec</text>
  <text class="text small" x="930" y="361">rubric weights</text>
  <text class="text small" x="930" y="386">thresholds</text>
  <text class="text small" x="930" y="411">release policy</text>
  <rect class="box" x="165" y="515" width="870" height="78"/>
  <text class="text label" x="305" y="548">Each fixture must be replayable without live production dependencies.</text>
  <text class="text small" x="322" y="575">The harness records what was simulated, what was real, and which behavior is allowed to drift.</text>
</svg>
