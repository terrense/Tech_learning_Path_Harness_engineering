<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Context Builder Control Plane</title>
  <desc id="desc">Agent harness context builder receives session, memory, retrieval, tools, and policy inputs, then emits an auditable context bundle.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#ffffff;stroke:#334155;stroke-width:2}.input{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.policy{fill:#fef3c7;stroke:#b45309;stroke-width:2}.output{fill:#dcfce7;stroke:#15803d;stroke-width:2}.audit{fill:#f3e8ff;stroke:#7e22ce;stroke-width:2}.txt{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:15px}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="txt h" x="60" y="54">Agent Harness Context Builder Control Plane</text>
  <text class="txt s" x="60" y="84">Every model step receives a selected, budgeted, auditable context bundle instead of raw accumulated history.</text>

  <rect class="input" x="70" y="140" width="230" height="78" rx="10"/>
  <text class="txt m" x="95" y="172">Session State</text>
  <text class="txt s" x="95" y="198">goal, phase, observations</text>

  <rect class="input" x="70" y="250" width="230" height="78" rx="10"/>
  <text class="txt m" x="95" y="282">Long-Term Memory</text>
  <text class="txt s" x="95" y="308">preferences, rules, decisions</text>

  <rect class="input" x="70" y="360" width="230" height="78" rx="10"/>
  <text class="txt m" x="95" y="392">Retrieval Evidence</text>
  <text class="txt s" x="95" y="418">documents, files, API facts</text>

  <rect class="input" x="70" y="470" width="230" height="78" rx="10"/>
  <text class="txt m" x="95" y="502">Tool Registry</text>
  <text class="txt s" x="95" y="528">schemas, risks, visibility</text>

  <rect class="panel" x="455" y="180" width="290" height="290" rx="18"/>
  <text class="txt h" x="500" y="225">Context Builder</text>
  <text class="txt s" x="500" y="265">1. score candidates</text>
  <text class="txt s" x="500" y="295">2. filter sensitive data</text>
  <text class="txt s" x="500" y="325">3. allocate token budget</text>
  <text class="txt s" x="500" y="355">4. order stable/dynamic blocks</text>
  <text class="txt s" x="500" y="385">5. emit trace metadata</text>
  <rect class="policy" x="490" y="410" width="220" height="36" rx="8"/>
  <text class="txt s" x="512" y="434">Policy + Budget Gate</text>

  <rect class="output" x="890" y="170" width="250" height="92" rx="12"/>
  <text class="txt m" x="920" y="204">Context Bundle</text>
  <text class="txt s" x="920" y="232">selected blocks + reasons</text>

  <rect class="audit" x="890" y="310" width="250" height="92" rx="12"/>
  <text class="txt m" x="920" y="344">Audit Trace</text>
  <text class="txt s" x="920" y="372">scores, omissions, tokens</text>

  <rect class="output" x="890" y="450" width="250" height="92" rx="12"/>
  <text class="txt m" x="920" y="484">Model Step</text>
  <text class="txt s" x="920" y="512">plan, tool call, answer</text>

  <path class="arrow" d="M300 179 C360 179 395 220 455 240"/>
  <path class="arrow" d="M300 289 C360 289 395 300 455 310"/>
  <path class="arrow" d="M300 399 C360 399 395 370 455 360"/>
  <path class="arrow" d="M300 509 C370 509 410 430 455 410"/>
  <path class="arrow" d="M745 260 C810 240 830 216 890 216"/>
  <path class="arrow" d="M745 335 C810 335 830 356 890 356"/>
  <path class="arrow" d="M1015 262 L1015 450"/>
  <path class="arrow" d="M890 496 C780 590 555 590 520 470"/>
</svg>
