<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Memory Retrieval Selection Pipeline</title>
  <desc id="desc">Pipeline showing memory records and retrieval hits scored, filtered, deduplicated, and converted into context blocks.</desc>
  <defs>
    <style>
      .bg{fill:#fbfbf7}.box{fill:#ffffff;stroke:#1f2937;stroke-width:2}.mem{fill:#eef2ff;stroke:#4338ca;stroke-width:2}.ret{fill:#ecfeff;stroke:#0e7490;stroke-width:2}.gate{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.out{fill:#ecfdf5;stroke:#047857;stroke-width:2}.txt{font-family:Arial,Helvetica,sans-serif;fill:#111827}.h{font-size:28px;font-weight:700}.m{font-size:19px;font-weight:700}.s{font-size:14px}.arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#374151"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="txt h" x="58" y="56">Memory + Retrieval Selection Pipeline</text>
  <text class="txt s" x="58" y="84">Context engineering separates persistent knowledge from the current model-visible context.</text>

  <rect class="mem" x="70" y="150" width="220" height="82" rx="10"/>
  <text class="txt m" x="95" y="184">Memory Records</text>
  <text class="txt s" x="95" y="210">preferences, rules, decisions</text>

  <rect class="ret" x="70" y="300" width="220" height="82" rx="10"/>
  <text class="txt m" x="95" y="334">Retrieval Hits</text>
  <text class="txt s" x="95" y="360">files, docs, logs, APIs</text>

  <rect class="box" x="390" y="130" width="210" height="92" rx="10"/>
  <text class="txt m" x="425" y="166">Score</text>
  <text class="txt s" x="425" y="194">relevance, recency, confidence</text>

  <rect class="gate" x="390" y="282" width="210" height="92" rx="10"/>
  <text class="txt m" x="425" y="318">Policy Filter</text>
  <text class="txt s" x="425" y="346">sensitivity, freshness, scope</text>

  <rect class="box" x="700" y="205" width="210" height="92" rx="10"/>
  <text class="txt m" x="735" y="241">Deduplicate</text>
  <text class="txt s" x="735" y="269">collapse repeated evidence</text>

  <rect class="box" x="700" y="355" width="210" height="92" rx="10"/>
  <text class="txt m" x="735" y="391">Budget Select</text>
  <text class="txt s" x="735" y="419">maximize utility per token</text>

  <rect class="out" x="975" y="270" width="170" height="118" rx="12"/>
  <text class="txt m" x="1005" y="310">Context</text>
  <text class="txt m" x="1005" y="336">Blocks</text>
  <text class="txt s" x="1005" y="365">with source ids</text>

  <path class="arrow" d="M290 191 L390 176"/>
  <path class="arrow" d="M290 341 L390 328"/>
  <path class="arrow" d="M600 176 C655 176 660 232 700 238"/>
  <path class="arrow" d="M600 328 C650 328 665 262 700 254"/>
  <path class="arrow" d="M805 297 L805 355"/>
  <path class="arrow" d="M910 401 C948 385 950 344 975 332"/>

  <rect class="gate" x="195" y="520" width="810" height="82" rx="14"/>
  <text class="txt m" x="235" y="552">Selection invariant</text>
  <text class="txt s" x="235" y="580">No memory or evidence enters the model-visible context without source, score, token estimate, and reason.</text>
</svg>
