<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Session Context Memory Flow</title>
  <desc id="desc">Flow diagram showing task session, short-term state, retrieval context, long-term memory, summaries, and model context window.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#334155" /></marker><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.14" /></filter></defs>
  <rect width="1280" height="820" fill="#ffffff" />
  <text x="640" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Session, Context, And Memory Flow</text>
  <text x="640" y="92" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#4b5563">A harness decides what belongs in state, what belongs in memory, and what enters the model context at each step.</text>
  <g filter="url(#shadow)"><rect x="90" y="170" width="250" height="110" rx="16" fill="#0f766e" /><text x="215" y="212" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Task Session</text><text x="215" y="242" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ccfbf1">goal · constraints · plan</text></g>
  <g filter="url(#shadow)"><rect x="515" y="170" width="250" height="110" rx="16" fill="#2563eb" /><text x="640" y="212" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Short-Term State</text><text x="640" y="242" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#dbeafe">steps · observations · diffs</text></g>
  <g filter="url(#shadow)"><rect x="940" y="170" width="250" height="110" rx="16" fill="#7c3aed" /><text x="1065" y="212" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Long-Term Memory</text><text x="1065" y="242" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ede9fe">preferences · history · facts</text></g>
  <g filter="url(#shadow)"><rect x="300" y="410" width="250" height="110" rx="16" fill="#ea580c" /><text x="425" y="452" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Retriever</text><text x="425" y="482" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ffedd5">files · docs · embeddings</text></g>
  <g filter="url(#shadow)"><rect x="730" y="410" width="250" height="110" rx="16" fill="#be123c" /><text x="855" y="452" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Summarizer</text><text x="855" y="482" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ffe4e6">compress · rank · prune</text></g>
  <g filter="url(#shadow)"><rect x="405" y="650" width="470" height="90" rx="18" fill="#111827" /><text x="640" y="687" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Model Context Window</text><text x="640" y="716" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#d1d5db">role contract · current task · selected state · selected memory · tool specs</text></g>
  <path d="M340 225 L511 225" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M765 225 L936 225" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M640 280 C575 342 500 373 440 406" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M1065 280 C1030 350 940 385 885 406" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M550 465 L726 465" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M425 520 C470 595 545 626 600 646" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M855 520 C815 590 745 626 680 646" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="640" y="785" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Generated for Terrence Shen · Context is not memory; context is the selected working set for the next model step.</text>
