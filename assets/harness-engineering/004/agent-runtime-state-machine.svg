<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness Runtime State Machine</title>
  <desc id="desc">State machine for an agent harness runtime from initialization to planning, acting, observing, verifying, completing, failing, or escalating.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#334155" /></marker><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.14" /></filter></defs>
  <rect width="1280" height="820" fill="#f9fafb" />
  <text x="640" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Agent Runtime State Machine</text>
  <text x="640" y="92" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">A robust harness makes agent execution explicit as states, transitions, guards, and terminal outcomes.</text>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="90" y="180" width="190" height="78" rx="16" fill="#0f766e" /><text x="185" y="228" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Initialized</text>
    <rect x="365" y="180" width="190" height="78" rx="16" fill="#2563eb" /><text x="460" y="228" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Planning</text>
    <rect x="640" y="180" width="190" height="78" rx="16" fill="#7c3aed" /><text x="735" y="228" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Acting</text>
    <rect x="915" y="180" width="190" height="78" rx="16" fill="#ea580c" /><text x="1010" y="228" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Observing</text>
    <rect x="505" y="405" width="270" height="86" rx="18" fill="#be123c" /><text x="640" y="457" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Verifying</text>
    <rect x="205" y="620" width="210" height="80" rx="16" fill="#16a34a" /><text x="310" y="668" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Completed</text>
    <rect x="535" y="620" width="210" height="80" rx="16" fill="#334155" /><text x="640" y="668" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Escalated</text>
    <rect x="865" y="620" width="210" height="80" rx="16" fill="#991b1b" /><text x="970" y="668" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Failed</text>
  </g>
  <path d="M280 219 L361 219" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M555 219 L636 219" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M830 219 L911 219" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M1010 258 C1000 350 810 402 779 425" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M505 448 C385 455 295 540 310 616" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M640 491 L640 616" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M775 448 C890 455 965 540 970 616" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M505 430 C400 380 410 295 455 262" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="355" y="385" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">continue</text>
  <text x="296" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">done</text>
  <text x="658" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">needs human</text>
  <text x="930" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">policy fail</text>
  <text x="640" y="780" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Generated for Terrence Shen · Explicit state machines prevent silent drift in long-running agent work.</text>
</svg>
