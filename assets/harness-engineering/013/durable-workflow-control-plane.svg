<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Durable Workflow Control Plane for Agent Harness</title>
  <desc id="desc">A deterministic diagram showing workflow definition, durable state, agent runtime, tool broker, checkpoints, human gates, trace ledger, and replay evaluator.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#334155;stroke-width:2}
      .store{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
      .gate{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .runtime{fill:#ecfeff;stroke:#0891b2;stroke-width:2}
      .trace{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
      .small{font-size:18px}
      .label{font-size:22px;font-weight:700}
      .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="text" x="60" y="62" font-size="34" font-weight="700">Agent Harness Durable Workflow Control Plane</text>
  <text class="text small" x="60" y="96">Workflow orchestration turns probabilistic agent actions into replayable, checkpointed, policy-gated execution.</text>

  <rect class="panel" x="60" y="145" width="230" height="110" rx="8"/>
  <text class="text label" x="88" y="188">Workflow Spec</text>
  <text class="text small" x="88" y="220">DAG / state machine</text>
  <text class="text small" x="88" y="245">retry and timeout rules</text>

  <rect class="store" x="390" y="135" width="260" height="130" rx="8"/>
  <text class="text label" x="426" y="180">Durable State</text>
  <text class="text small" x="426" y="213">workflow id</text>
  <text class="text small" x="426" y="238">step status and leases</text>

  <rect class="runtime" x="760" y="135" width="300" height="130" rx="8"/>
  <text class="text label" x="800" y="180">Agent Runtime</text>
  <text class="text small" x="800" y="213">model calls, tools</text>
  <text class="text small" x="800" y="238">handoffs, guardrails</text>

  <rect class="gate" x="90" y="360" width="260" height="130" rx="8"/>
  <text class="text label" x="126" y="405">Human Gate</text>
  <text class="text small" x="126" y="438">approval checkpoint</text>
  <text class="text small" x="126" y="463">exception decision</text>

  <rect class="panel" x="470" y="360" width="260" height="130" rx="8"/>
  <text class="text label" x="509" y="405">Tool Broker</text>
  <text class="text small" x="509" y="438">idempotency keys</text>
  <text class="text small" x="509" y="463">side-effect ledger</text>

  <rect class="trace" x="840" y="360" width="280" height="130" rx="8"/>
  <text class="text label" x="880" y="405">Trace Ledger</text>
  <text class="text small" x="880" y="438">spans and events</text>
  <text class="text small" x="880" y="463">replay evidence</text>

  <rect class="store" x="340" y="565" width="520" height="90" rx="8"/>
  <text class="text label" x="402" y="615">Replay and Eval Harness</text>
  <text class="text small" x="402" y="645">deterministic stubs, trajectory grading, compensation verification</text>

  <path class="arrow" d="M290 200 H390"/>
  <path class="arrow" d="M650 200 H760"/>
  <path class="arrow" d="M910 265 V360"/>
  <path class="arrow" d="M760 425 H730"/>
  <path class="arrow" d="M470 425 H350"/>
  <path class="dash" d="M220 360 V255"/>
  <path class="dash" d="M980 490 C980 565 860 610 860 610"/>
  <path class="dash" d="M600 490 V565"/>
  <path class="dash" d="M340 610 C190 610 165 490 165 490"/>
</svg>
