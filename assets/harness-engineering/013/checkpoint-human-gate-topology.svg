<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint and Human Gate Topology</title>
  <desc id="desc">Topology showing checkpoints before high-risk tools, model handoffs, memory writes, and release transitions.</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .lane{fill:#ffffff;stroke:#0f172a;stroke-width:2}
      .step{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
      .gate{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .risk{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
      .title{font-size:34px;font-weight:700}
      .label{font-size:20px;font-weight:700}
      .small{font-size:16px}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="text title" x="60" y="62">Checkpoint and Human Gate Topology</text>
  <text class="text small" x="60" y="96">Human gates are placed where irreversible side effects, cross-agent delegation, or policy ambiguity enter the workflow.</text>

  <rect class="lane" x="70" y="145" width="1060" height="120" rx="8"/>
  <text class="text label" x="96" y="190">Low Risk Lane</text>
  <rect class="step" x="260" y="168" width="160" height="74" rx="8"/>
  <text class="text label" x="304" y="212">Plan</text>
  <rect class="step" x="520" y="168" width="160" height="74" rx="8"/>
  <text class="text label" x="554" y="212">Read</text>
  <rect class="step" x="780" y="168" width="160" height="74" rx="8"/>
  <text class="text label" x="809" y="212">Summarize</text>

  <rect class="lane" x="70" y="320" width="1060" height="120" rx="8"/>
  <text class="text label" x="96" y="365">Medium Risk Lane</text>
  <rect class="step" x="260" y="343" width="160" height="74" rx="8"/>
  <text class="text label" x="291" y="387">Patch</text>
  <rect class="gate" x="520" y="343" width="160" height="74" rx="8"/>
  <text class="text label" x="553" y="387">Review Gate</text>
  <rect class="step" x="780" y="343" width="160" height="74" rx="8"/>
  <text class="text label" x="825" y="387">Merge</text>

  <rect class="lane" x="70" y="495" width="1060" height="120" rx="8"/>
  <text class="text label" x="96" y="540">High Risk Lane</text>
  <rect class="risk" x="240" y="518" width="180" height="74" rx="8"/>
  <text class="text label" x="268" y="562">External Tool</text>
  <rect class="gate" x="500" y="518" width="200" height="74" rx="8"/>
  <text class="text label" x="524" y="562">Human Approval</text>
  <rect class="risk" x="790" y="518" width="180" height="74" rx="8"/>
  <text class="text label" x="826" y="562">Commit Effect</text>

  <path class="arrow" d="M420 205 H520"/>
  <path class="arrow" d="M680 205 H780"/>
  <path class="arrow" d="M420 380 H520"/>
  <path class="arrow" d="M680 380 H780"/>
  <path class="arrow" d="M420 555 H500"/>
  <path class="arrow" d="M700 555 H790"/>
  <path class="arrow" d="M600 417 V518"/>
  <text class="text small" x="614" y="475">risk escalation</text>
</svg>
