<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Privacy and Retention Governance Matrix</title>
  <desc id="desc">A matrix mapping agent memory classes to retention, privacy and retrieval governance controls.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="64" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Privacy and Retention Governance Matrix</text>
  <text x="64" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Memory governance combines sensitivity, persistence, retrieval authority and deletion evidence.</text>

  <g transform="translate(100 160)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="1080" height="460" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <g font-size="15" font-weight="700" fill="#0f172a">
      <rect x="0" y="0" width="1080" height="64" rx="18" fill="#e2e8f0"/>
      <text x="110" y="39" text-anchor="middle">Memory Class</text>
      <text x="330" y="39" text-anchor="middle">Retention</text>
      <text x="545" y="39" text-anchor="middle">Privacy Control</text>
      <text x="760" y="39" text-anchor="middle">Retrieval Authority</text>
      <text x="970" y="39" text-anchor="middle">Evidence</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="220" y1="0" x2="220" y2="460"/>
      <line x1="440" y1="0" x2="440" y2="460"/>
      <line x1="650" y1="0" x2="650" y2="460"/>
      <line x1="870" y1="0" x2="870" y2="460"/>
      <line x1="0" y1="64" x2="1080" y2="64"/>
      <line x1="0" y1="143" x2="1080" y2="143"/>
      <line x1="0" y1="222" x2="1080" y2="222"/>
      <line x1="0" y1="301" x2="1080" y2="301"/>
      <line x1="0" y1="380" x2="1080" y2="380"/>
    </g>
    <g font-size="15" fill="#334155">
      <text x="110" y="111" text-anchor="middle" font-weight="700" fill="#1e3a8a">Session fact</text>
      <text x="330" y="111" text-anchor="middle">minutes-hours</text>
      <text x="545" y="111" text-anchor="middle">context boundary</text>
      <text x="760" y="111" text-anchor="middle">current agent only</text>
      <text x="970" y="111" text-anchor="middle">trace id</text>

      <text x="110" y="190" text-anchor="middle" font-weight="700" fill="#14532d">User preference</text>
      <text x="330" y="190" text-anchor="middle">explicit ttl</text>
      <text x="545" y="190" text-anchor="middle">consent + edit</text>
      <text x="760" y="190" text-anchor="middle">purpose-scoped</text>
      <text x="970" y="190" text-anchor="middle">consent record</text>

      <text x="110" y="269" text-anchor="middle" font-weight="700" fill="#78350f">Domain knowledge</text>
      <text x="330" y="269" text-anchor="middle">versioned</text>
      <text x="545" y="269" text-anchor="middle">source license</text>
      <text x="760" y="269" text-anchor="middle">role-scoped</text>
      <text x="970" y="269" text-anchor="middle">document hash</text>

      <text x="110" y="348" text-anchor="middle" font-weight="700" fill="#701a75">Sensitive signal</text>
      <text x="330" y="348" text-anchor="middle">short or none</text>
      <text x="545" y="348" text-anchor="middle">redact/tokenize</text>
      <text x="760" y="348" text-anchor="middle">human gate</text>
      <text x="970" y="348" text-anchor="middle">approval log</text>

      <text x="110" y="427" text-anchor="middle" font-weight="700" fill="#7f1d1d">Incident marker</text>
      <text x="330" y="427" text-anchor="middle">audit window</text>
      <text x="545" y="427" text-anchor="middle">sealed access</text>
      <text x="760" y="427" text-anchor="middle">AgentOps only</text>
      <text x="970" y="427" text-anchor="middle">case link</text>
    </g>
  </g>
  <text x="64" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">The matrix is enforced before write, before retrieval, during compaction, and during deletion verification.</text>
</svg>
