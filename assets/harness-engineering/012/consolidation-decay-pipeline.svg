<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Memory Consolidation and Decay Pipeline</title>
  <desc id="desc">A pipeline showing promotion, consolidation, decay and deletion of agent memories.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#fefce8"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#fbfbf8"/>
  <text x="64" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Consolidation and Decay Pipeline</text>
  <text x="64" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Short-lived observations become durable memory only after utility, safety and provenance checks.</text>
  <rect x="64" y="162" width="1152" height="390" rx="22" fill="url(#band)" stroke="#cbd5e1"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(110 236)">
      <circle cx="72" cy="72" r="70" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="72" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Ephemeral</text>
      <text x="72" y="84" text-anchor="middle" font-size="13" fill="#1d4ed8">session buffer</text>
    </g>
    <g transform="translate(344 236)">
      <circle cx="72" cy="72" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="72" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Candidate</text>
      <text x="72" y="84" text-anchor="middle" font-size="13" fill="#166534">write proposal</text>
    </g>
    <g transform="translate(578 236)">
      <circle cx="72" cy="72" r="70" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="72" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Consolidated</text>
      <text x="72" y="84" text-anchor="middle" font-size="13" fill="#92400e">stable summary</text>
    </g>
    <g transform="translate(812 236)">
      <circle cx="72" cy="72" r="70" fill="#fae8ff" stroke="#c026d3" stroke-width="3"/>
      <text x="72" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#701a75">Decayed</text>
      <text x="72" y="84" text-anchor="middle" font-size="13" fill="#86198f">lower confidence</text>
    </g>
    <g transform="translate(1046 236)">
      <circle cx="72" cy="72" r="70" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="72" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Deleted</text>
      <text x="72" y="84" text-anchor="middle" font-size="13" fill="#991b1b">tombstone</text>
    </g>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M254 308 H336"/>
    <path d="M488 308 H570"/>
    <path d="M722 308 H804"/>
    <path d="M956 308 H1038"/>
    <path d="M650 378 C640 458 398 472 354 382" stroke-dasharray="8 8"/>
    <path d="M884 378 C850 500 670 510 616 384" stroke-dasharray="8 8"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">
    <text x="296" y="288" text-anchor="middle">salience</text>
    <text x="296" y="330" text-anchor="middle">filter</text>
    <text x="530" y="288" text-anchor="middle">policy</text>
    <text x="530" y="330" text-anchor="middle">approval</text>
    <text x="764" y="288" text-anchor="middle">age + drift</text>
    <text x="764" y="330" text-anchor="middle">score</text>
    <text x="998" y="288" text-anchor="middle">retention</text>
    <text x="998" y="330" text-anchor="middle">expiry</text>
    <text x="502" y="476" text-anchor="middle">rewrite when evidence changes</text>
    <text x="744" y="512" text-anchor="middle">revalidate before retrieval</text>
  </g>

  <rect x="162" y="586" width="956" height="58" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <text x="640" y="622" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#0f172a">Promotion is reversible: a harness can demote stale memory, quarantine suspicious memory, and retain auditable tombstones.</text>
</svg>
