<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Memory Provenance and Lineage Graph</title>
  <desc id="desc">A graph showing how agent memory records preserve source, consent, transformation and retrieval evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#111827" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#f7fbff"/>
  <text x="64" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Memory Provenance and Lineage Graph</text>
  <text x="64" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Every remembered fact must carry source, scope, consent, transform and use evidence.</text>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M218 206 C330 150 438 160 528 228"/>
    <path d="M218 330 C324 350 408 348 528 308"/>
    <path d="M646 268 C750 232 842 218 948 248"/>
    <path d="M646 306 C770 356 846 402 948 384"/>
    <path d="M1066 316 C1128 344 1152 410 1118 482"/>
    <path d="M948 522 C790 578 526 584 366 528" stroke-dasharray="10 8"/>
    <path d="M286 482 C250 438 220 392 218 330" stroke-dasharray="10 8"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(84 162)">
      <rect width="190" height="92" rx="16" fill="#dbeafe" stroke="#2563eb"/>
      <text x="95" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Source Event</text>
      <text x="95" y="62" text-anchor="middle" font-size="13" fill="#1d4ed8">conversation, tool, doc</text>
    </g>
    <g transform="translate(84 286)">
      <rect width="190" height="92" rx="16" fill="#dcfce7" stroke="#16a34a"/>
      <text x="95" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Consent Scope</text>
      <text x="95" y="62" text-anchor="middle" font-size="13" fill="#166534">tenant, purpose, ttl</text>
    </g>
    <g transform="translate(508 220)">
      <rect width="160" height="110" rx="18" fill="#ffffff" stroke="#334155"/>
      <text x="80" y="39" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Memory</text>
      <text x="80" y="66" text-anchor="middle" font-size="14" fill="#475569">record id</text>
      <text x="80" y="88" text-anchor="middle" font-size="14" fill="#475569">hash + policy</text>
    </g>
    <g transform="translate(940 214)">
      <rect width="190" height="92" rx="16" fill="#fef3c7" stroke="#d97706"/>
      <text x="95" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Transform</text>
      <text x="95" y="62" text-anchor="middle" font-size="13" fill="#92400e">redact, embed, summarize</text>
    </g>
    <g transform="translate(940 348)">
      <rect width="190" height="92" rx="16" fill="#fae8ff" stroke="#c026d3"/>
      <text x="95" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#701a75">Retrieval Use</text>
      <text x="95" y="62" text-anchor="middle" font-size="13" fill="#86198f">query, rank, injection</text>
    </g>
    <g transform="translate(1020 486)">
      <rect width="190" height="92" rx="16" fill="#fee2e2" stroke="#dc2626"/>
      <text x="95" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Deletion Proof</text>
      <text x="95" y="62" text-anchor="middle" font-size="13" fill="#991b1b">tombstone + audit</text>
    </g>
    <g transform="translate(252 482)">
      <rect width="220" height="92" rx="16" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="110" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0c4a6e">Eval Evidence</text>
      <text x="110" y="62" text-anchor="middle" font-size="13" fill="#075985">utility, leakage, drift</text>
    </g>
  </g>

  <text x="64" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">The harness treats memory as governed evidence, not as a loose vector-store side effect.</text>
</svg>
