<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Coordination Protocol State Machine</title>
  <desc id="desc">State machine for a governed multi-agent coordination protocol.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .state{fill:#ffffff;stroke:#2563eb;stroke-width:2.4}
      .risk{fill:#fff7ed;stroke:#ea580c;stroke-width:2.4}
      .done{fill:#ecfdf5;stroke:#059669;stroke-width:2.4}
      .fail{fill:#fff1f2;stroke:#e11d48;stroke-width:2.4}
      .line{stroke:#1f2937;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#111827}
      .h{font-size:25px;font-weight:700}
      .m{font-size:15px;font-weight:700}
      .s{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="h" x="46" y="56">Coordination Protocol State Machine</text>
  <text class="s" x="46" y="82">A multi-agent harness makes delegation auditable by forcing every handoff through explicit states.</text>

  <rect class="state" x="70" y="175" width="150" height="72" rx="16"/>
  <text class="m" x="105" y="204">Intake</text>
  <text class="s" x="92" y="228">normalize goal</text>

  <rect class="state" x="285" y="175" width="150" height="72" rx="16"/>
  <text class="m" x="318" y="204">Decompose</text>
  <text class="s" x="310" y="228">task graph</text>

  <rect class="risk" x="500" y="175" width="150" height="72" rx="16"/>
  <text class="m" x="532" y="204">Lease</text>
  <text class="s" x="520" y="228">role + tools</text>

  <rect class="state" x="715" y="175" width="150" height="72" rx="16"/>
  <text class="m" x="747" y="204">Execute</text>
  <text class="s" x="744" y="228">bounded run</text>

  <rect class="state" x="930" y="175" width="150" height="72" rx="16"/>
  <text class="m" x="966" y="204">Report</text>
  <text class="s" x="954" y="228">evidence pack</text>

  <rect class="risk" x="285" y="376" width="150" height="72" rx="16"/>
  <text class="m" x="320" y="405">Dispute</text>
  <text class="s" x="302" y="429">conflict detected</text>

  <rect class="done" x="500" y="376" width="150" height="72" rx="16"/>
  <text class="m" x="532" y="405">Merge</text>
  <text class="s" x="520" y="429">facts + artifacts</text>

  <rect class="done" x="715" y="376" width="150" height="72" rx="16"/>
  <text class="m" x="748" y="405">Review</text>
  <text class="s" x="740" y="429">rubric + trace</text>

  <rect class="done" x="930" y="376" width="150" height="72" rx="16"/>
  <text class="m" x="963" y="405">Commit</text>
  <text class="s" x="954" y="429">final decision</text>

  <rect class="fail" x="500" y="505" width="150" height="72" rx="16"/>
  <text class="m" x="527" y="534">Quarantine</text>
  <text class="s" x="522" y="558">unsafe branch</text>

  <path class="line" d="M220 211 L285 211"/>
  <path class="line" d="M435 211 L500 211"/>
  <path class="line" d="M650 211 L715 211"/>
  <path class="line" d="M865 211 L930 211"/>
  <path class="line" d="M1005 247 L1005 376"/>
  <path class="line" d="M930 412 L865 412"/>
  <path class="line" d="M715 412 L650 412"/>
  <path class="dash" d="M500 412 L435 412"/>
  <path class="dash" d="M360 376 C390 322 470 278 555 247"/>
  <path class="dash" d="M575 448 L575 505"/>
  <path class="dash" d="M575 505 C690 492 762 466 790 448"/>

  <text class="s" x="238" y="196">intent</text>
  <text class="s" x="454" y="196">risk tier</text>
  <text class="s" x="674" y="196">capability</text>
  <text class="s" x="884" y="196">trace</text>
  <text class="s" x="372" y="365">conflict</text>
  <text class="s" x="590" y="487">policy breach</text>
</svg>
