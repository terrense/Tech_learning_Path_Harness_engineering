<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Agent Delegation Topology</title>
  <desc id="desc">A deterministic diagram showing orchestrator, specialist agents, policy broker, tool broker, and evidence store in a multi-agent harness.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}
      .agent{fill:#eef6ff;stroke:#2563eb;stroke-width:2}
      .control{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .risk{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .store{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .h{font-size:25px;font-weight:700}
      .m{font-size:17px;font-weight:700}
      .s{font-size:13px;fill:#475569}
      .tiny{font-size:12px;fill:#64748b}
    </style>
  </defs>
  <rect class="bg" width="1120" height="620" rx="0"/>
  <text class="h" x="44" y="56">Multi-Agent Harness Delegation Topology</text>
  <text class="s" x="44" y="84">Delegation is a governed runtime protocol, not an informal prompt convention.</text>

  <rect class="panel" x="38" y="118" width="1044" height="450" rx="18"/>

  <rect class="agent" x="455" y="154" width="210" height="86" rx="14"/>
  <text class="m" x="495" y="190">Orchestrator</text>
  <text class="s" x="488" y="214">goal decomposition</text>

  <rect class="agent" x="98" y="326" width="190" height="80" rx="14"/>
  <text class="m" x="139" y="358">Planner</text>
  <text class="s" x="123" y="382">task graph, risks</text>

  <rect class="agent" x="335" y="326" width="190" height="80" rx="14"/>
  <text class="m" x="373" y="358">Researcher</text>
  <text class="s" x="365" y="382">evidence retrieval</text>

  <rect class="agent" x="592" y="326" width="190" height="80" rx="14"/>
  <text class="m" x="632" y="358">Executor</text>
  <text class="s" x="621" y="382">toolful actions</text>

  <rect class="agent" x="828" y="326" width="190" height="80" rx="14"/>
  <text class="m" x="868" y="358">Reviewer</text>
  <text class="s" x="860" y="382">trace critique</text>

  <rect class="control" x="132" y="162" width="210" height="78" rx="14"/>
  <text class="m" x="172" y="194">Policy Broker</text>
  <text class="s" x="158" y="216">role, permission, budget</text>

  <rect class="risk" x="780" y="162" width="210" height="78" rx="14"/>
  <text class="m" x="820" y="194">Tool Broker</text>
  <text class="s" x="811" y="216">schema, sandbox, audit</text>

  <rect class="store" x="348" y="472" width="424" height="58" rx="14"/>
  <text class="m" x="475" y="497">Evidence Store</text>
  <text class="s" x="428" y="518">messages, handoffs, tool spans, artifacts, scores</text>

  <path class="line" d="M 520 240 C 430 274 320 302 230 326"/>
  <path class="line" d="M 545 240 C 500 282 462 300 440 326"/>
  <path class="line" d="M 582 240 C 612 282 645 302 675 326"/>
  <path class="line" d="M 618 240 C 708 280 816 304 900 326"/>

  <path class="soft" d="M 342 201 L 455 196"/>
  <path class="soft" d="M 665 196 L 780 201"/>
  <path class="soft" d="M 192 406 C 260 450 380 468 500 472"/>
  <path class="soft" d="M 430 406 C 474 438 520 454 548 472"/>
  <path class="soft" d="M 688 406 C 662 440 626 456 590 472"/>
  <path class="soft" d="M 924 406 C 850 454 734 470 620 472"/>

  <text class="tiny" x="448" y="286">delegation envelopes</text>
  <text class="tiny" x="696" y="289">capability leases</text>
  <text class="tiny" x="462" y="552">The harness records inter-agent causality before judging the final answer.</text>
</svg>
